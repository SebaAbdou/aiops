apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mlops-dashboard
  namespace: aiops
  labels:
    grafana_dashboard: "1"
data:
  aiops-mlops-dashboard.json: |
    {
      "description": "AIOps MLOps Pipeline: Real-time Model Health, Drift Detection, Retraining Progress & History",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.80},
                  {"color": "green", "value": 0.85}
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"values": false, "fields": "", "calcs": ["lastNotNull"]},
            "textMode": "auto"
          },
          "targets": [{"expr": "mlops_model_roc_auc", "refId": "A"}],
          "title": "🎯 MODEL HEALTH (ROC-AUC)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            }
          },
          "gridPos": {"h": 6, "w": 3, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"values": false, "fields": "", "calcs": ["lastNotNull"]},
            "textMode": "auto"
          },
          "targets": [{"expr": "mlops_retraining_in_progress", "refId": "A"}],
          "title": "🔄 RETRAINING RUNNING?",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            }
          },
          "gridPos": {"h": 6, "w": 3, "x": 9, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"values": false, "fields": "", "calcs": ["lastNotNull"]},
            "textMode": "auto"
          },
          "targets": [{"expr": "mlops_drift_detected", "refId": "A"}],
          "title": "🚨 DRIFT DETECTED?",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"values": false, "fields": "", "calcs": ["lastNotNull"]},
            "textMode": "auto"
          },
          "targets": [{"expr": "mlops_samples_collected", "refId": "A"}],
          "title": "📦 TRAINING DATA READY",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisLabel": "ROC-AUC Score",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.80},
                  {"color": "green", "value": 0.85}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 5,
          "options": {
            "legend": {"calcs": ["last", "min", "max", "mean"], "displayMode": "table", "placement": "right"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [{"expr": "mlops_model_roc_auc", "refId": "A", "legendFormat": "ROC-AUC"}],
          "title": "📈 MODEL PERFORMANCE TREND (Watch for recovery after retrain)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisLabel": "Accuracy %",
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 6,
          "options": {
            "legend": {"calcs": ["last", "min", "max"], "displayMode": "table", "placement": "right"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [{"expr": "mlops_model_accuracy", "refId": "A", "legendFormat": "Accuracy"}],
          "title": "📊 ACCURACY TREND",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisLabel": "Status (1=Detected)",
                "barAlignment": 1,
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}]}
            }
          },
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 14},
          "id": 7,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [{"expr": "mlops_drift_detected", "refId": "A", "legendFormat": "Drift Event (1=Detected)"}],
          "title": "🚨 DRIFT DETECTION TIMELINE (Red bars = Drift detected, will trigger retrain)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisLabel": "Samples",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 200},
                  {"color": "green", "value": 400}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "id": 8,
          "options": {
            "legend": {"calcs": ["last", "max"], "displayMode": "table", "placement": "right"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [{"expr": "mlops_samples_collected", "refId": "A", "legendFormat": "Training Data"}],
          "title": "📦 DATA VOLUME FOR RETRAINING (Yellow≥200, Green≥400)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisLabel": "Duration (seconds)",
                "barAlignment": 1,
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "id": 9,
          "options": {
            "legend": {"calcs": ["last", "mean"], "displayMode": "table", "placement": "right"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [{"expr": "mlops_retraining_duration_seconds", "refId": "A", "legendFormat": "Duration"}],
          "title": "⏱️ RETRAINING JOB DURATION (How long each retrain takes)",
          "type": "timeseries"
        },
        {
          "datasource": "-- Grafana --",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "align": "auto",
                "displayMode": "auto"
              },
              "mappings": []
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
          "id": 10,
          "options": {"showHeader": true},
          "pluginVersion": "9.0.0",
          "targets": [],
          "title": "📋 RETRAINING AUDIT TRAIL (Check /shared/mlops_status.json for details)",
          "type": "table"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["mlops", "monitoring", "drift-detection", "retraining", "model-health"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "🚀 AIOps MLOps PIPELINE - LIVE MONITORING",
      "uid": "aiops-mlops-dashboard",
      "version": 1
    }
